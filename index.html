<style>
/* Layout: one-column phone app, sticky top bar, bottom tab bar; big tap targets for wet hands and sun glare. */
:root{
  --bg:#eef3f2; --surface:#ffffff; --ink:#0f2a30; --muted:#557077;
  --accent:#0b6b78; --accent-ink:#ffffff; --line:#cfdcdc; --soft:#dcebea;
  --warn:#b4471b; --ok:#2e7d4f;
  --S:#5e8f96; --F:#2f7f8a; --M:#0b5f6b; --A:#0a3d47; --P:#7a5a12;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1a1e; --surface:#11262b; --ink:#e3f0ef; --muted:#93adb1;
  --accent:#3fb6c2; --accent-ink:#04191d; --line:#24434a; --soft:#173339;
  --warn:#f08a5d; --ok:#6cc893;
  --S:#5c8b91; --F:#3a9aa5; --M:#2ab3c0; --A:#7fe0e8; --P:#d9b45a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a1a1e; --surface:#11262b; --ink:#e3f0ef; --muted:#93adb1;
  --accent:#3fb6c2; --accent-ink:#04191d; --line:#24434a; --soft:#173339;
  --warn:#f08a5d; --ok:#6cc893;
  --S:#5c8b91; --F:#3a9aa5; --M:#2ab3c0; --A:#7fe0e8; --P:#d9b45a; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto}
header.top{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));display:flex;align-items:center;gap:12px}
header.top h1{font:700 22px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0;flex:1;text-wrap:balance}
header.top .sub{font-size:13px;opacity:.85}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.18);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
main>*{flex-shrink:0}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);max-width:720px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
nav.tabs button .n{font:400 12px/1 var(--body);letter-spacing:0;text-transform:none}
nav.tabs button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
h2{font:700 20px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font:600 16px/1.1 var(--display);letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:400px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
label.f.missing>span::after{content:" · needed";color:var(--warn);font-weight:700}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:70px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin:0}
.btn{min-height:46px;padding:10px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--warn);color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1}
/* Species list */
.sbar{position:sticky;top:-16px;z-index:3;background:var(--bg);padding:8px 0;display:flex;flex-direction:column;gap:8px;margin-top:-8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.splist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fam{font:600 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--soft);padding:7px 12px}
.sp{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 8px 8px 12px;border-top:1px solid var(--line)}
.sp:first-child{border-top:0}
.sp.on{box-shadow:inset 4px 0 0 var(--accent)}
.sp .nm{font-weight:700;line-height:1.2}
.sp .sci{font-size:13px;color:var(--muted);font-style:italic}
.sp .sci .pct{font-style:normal;font-weight:700;color:var(--accent)}
.sp .sci b{font-style:normal;font-weight:400;font-variant-numeric:tabular-nums}
.ab{display:flex;gap:4px}
.ab button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font:700 18px/1 var(--display)}
.ab button[aria-pressed="true"][data-v="S"]{background:var(--S);border-color:var(--S);color:#fff}
.ab button[aria-pressed="true"][data-v="F"]{background:var(--F);border-color:var(--F);color:#fff}
.ab button[aria-pressed="true"][data-v="M"]{background:var(--M);border-color:var(--M);color:#fff}
.ab button[aria-pressed="true"][data-v="A"]{background:var(--A);border-color:var(--A);color:var(--bg)}
.ab button[aria-pressed="true"][data-v="P"]{background:var(--P);border-color:var(--P);color:#fff;width:auto;padding:0 10px}
.ab button[data-v="P"]{width:auto;padding:0 10px;font-size:15px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend b{font-family:var(--display);color:var(--ink)}
.empty{padding:20px;text-align:center;color:var(--muted)}
/* Site picker */
.sitebtn{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:56px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.sitebtn .grow{flex:1}
.sitebtn .nm{font-weight:700}
.sitebtn .ar{font-size:13px;color:var(--muted)}
.sitebtn .cd{font:600 15px/1 var(--display);letter-spacing:.04em;color:var(--accent);font-variant-numeric:tabular-nums}
.sres{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sres button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 12px;border-top:1px solid var(--line);cursor:pointer}
.sres button:first-child{border-top:0}
.sres button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.sres .nm{font-weight:700}
.sres .ar{grid-column:1;font-size:13px;color:var(--muted)}
.sres .cd{grid-row:1/3;grid-column:2;align-self:center;font:600 15px/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.sres .area{grid-template-columns:1fr auto}
.sres .area .nm{font-weight:400}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.crumbs button{border:0;background:none;color:var(--accent);padding:4px 0;text-decoration:underline}
/* Log */
.svy{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.svy .t{font-weight:700}
.svy .m{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{font:600 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:6px;border:1px solid currentColor;white-space:nowrap}
.badge.draft{color:var(--muted)} .badge.ready{color:var(--accent)} .badge.entered{color:var(--ok)} .badge.ex{color:var(--P)}
/* Review */
.rv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.rv dt{color:var(--muted)} .rv dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.rv dd.miss{color:var(--warn)}
.step{font:700 13px/1 var(--display);letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
.sumtable{width:100%;border-collapse:collapse;font-size:15px}
.sumtable td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.sumtable td.c{font-variant-numeric:tabular-nums;color:var(--muted);width:3.5em}
.sumtable td.v{font:700 18px/1 var(--display);text-align:right;width:2.5em}
.sumtable tr.fh td{font:600 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--soft);border-top:0;padding:6px}
pre.out{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;max-height:260px;overflow:auto;margin:0}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);max-width:420px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div style="flex:1">
      <h1>REEF Dive Survey</h1>

    <button data-tab="species">Species<span class="n" id="nSp"></span></button>
    <button data-tab="review">Submit<span class="n">To REEF</span></button>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

const UNL = UNL_RAW.trim() ? UNL_RAW.trim().split("\n").map(l=>{ const [name,sci,fam,regs]=l.split("|"); return {name,sci,fam,regs:(regs||"").split(",").filter(Boolean),hay:(name+" "+sci+" "+fam).toLowerCase().replace(/['’]/g,"")}; }) : [];
const UNL_BY = Object.fromEntries(UNL.map(u=>[u.sci,u]));
function unlSearch(q,limit){
  const words=q.toLowerCase().replace(/['’]/g,"").split(/\s+/).filter(Boolean); if(!words.length) return [];
  const hits=UNL.filter(u=>words.every(w=>u.hay.includes(w)));
  // Tropical Eastern Pacific first (strays into California), then names starting with the query
  const rank=u=>(u.regs.includes("TEP")?0:2)+(u.name.toLowerCase().startsWith(words[0])?0:1);
  hits.sort((a,b)=>rank(a)-rank(b)||a.name.localeCompare(b.name));
  return limit?hits.slice(0,limit):hits;
}

const ZONES = new Map(SITES_RAW.trim().split("\n").map(l=>{const i=l.indexOf("|");return [l.slice(0,i), l.slice(i+1)];}));
const tidy = n => n.replace(/\s+/g," ").trim();
function zoneParents(code){ const out=[]; for(let k=code.length-1;k>=1;k--){ const p=code.slice(0,k); if(ZONES.has(p)) out.unshift(p); } return out; }
function areaLabel(code){ const ps=zoneParents(code).filter(p=>p.length>=4); return ps.slice(-2).map(p=>tidy(ZONES.get(p))).join(" › "); }
const SITE_LIST = [...ZONES.entries()].filter(([c,n])=>c.length===8 && !/^Please use/i.test(n)).map(([code,name])=>{const area=areaLabel(code); return {code,name:tidy(name),area,hay:(name+" "+zoneParents(code).map(p=>ZONES.get(p)).join(" ")).toLowerCase().replace(/['’.]/g,"")};});
const SITE_BY_CODE = Object.fromEntries(SITE_LIST.map(s=>[s.code,s]));

/* ---------- Cloud sync (artifact db; Claude can read it for auto-fill) ---------- */
let db=null, cloudQueue=new Set(), cloudBusy=false;
function setSync(txt, ok){ document.getElementById("syncTxt").textContent=txt; document.getElementById("syncPill").style.opacity = ok?1:.8; }
function queueCloud(id){ if(!db) return; cloudQueue.add(id); clearTimeout(saveTimer); saveTimer=setTimeout(flushCloud,1200); }
async function flushCloud(){
  if(!db||cloudBusy) return; cloudBusy=true;
  try{
    for(const id of [...cloudQueue]){
      cloudQueue.delete(id);
      try{
        if(id==="__settings"){ await db.doc("settings/main").set(JSON.parse(JSON.stringify(state.settings))); continue; }
        const sv=state.surveys[id];
        if(!sv){ await db.doc("surveys/"+id).delete(); continue; }
        if(sv.example) continue;
        await db.doc("surveys/"+id).set(JSON.parse(JSON.stringify(sv)));
      }catch(e){ cloudQueue.add(id); setSync("Offline · saved on phone",false); cloudBusy=false; setTimeout(flushCloud,15000); return; }
    }
    setSync("Synced",true);
  } finally { cloudBusy=false; }
}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use) return;
    const d = await window.claude.use("db"); if(!d) return;
    db=d; setSync("Connecting…",false);
    const timer=setTimeout(()=>setSync("Offline · saved on phone",false),10000);
    const [snap, st] = await Promise.all([db.collection("surveys").get(), db.doc("settings/main").get()]);
    clearTimeout(timer);
    let changed=false;
    for(const doc of snap.docs){
      const remote=JSON.parse(JSON.stringify(doc.data()));
      if(state.deleted[remote.id]) { cloudQueue.add(remote.id); continue; }
      const local=state.surveys[remote.id];
      if(!local || (remote.updatedAt||0)>(local.updatedAt||0)){ state.surveys[remote.id]=remote; changed=true; }
    }
    const remoteIds=new Set(snap.docs.map(d=>d.id));
    for(const sv of Object.values(state.surveys)) if(!sv.example && !remoteIds.has(sv.id)) cloudQueue.add(sv.id);
    if(st.exists){ const rs=st.data(); if((rs.updatedAt||0)>(state.settings.updatedAt||0)){ state.settings=JSON.parse(JSON.stringify(rs)); changed=true; } }
    else cloudQueue.add("__settings");
    if(changed){ persist(); render(); }
    setSync("Synced",true);
    flushCloud();
  }catch(e){ setSync("Offline · saved on phone",false); }
}
window.addEventListener("online",()=>flushCloud());

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function depthRange(ft){ if(ft===""||ft==null||isNaN(+ft)) return ""; const lo=Math.floor(+ft/10)*10; return `${lo}–${lo+9} ft`; }
/* Depth can be entered in feet or meters; REEF takes 10-ft ranges, so meters are converted to feet first. */
const FT_PER_M = 3.28084;
const dUnit = i => i.depthUnit==="m" ? "m" : "ft";
function depthFt(i,key){ const v=i[key]; if(v===""||v==null||isNaN(+v)) return null; return dUnit(i)==="m" ? +v*FT_PER_M : +v; }
function dRange(i,key){ const ft=depthFt(i,key); return ft==null ? "" : depthRange(ft); }
function dShow(i,key){ const ft=depthFt(i,key); if(ft==null) return ""; return dUnit(i)==="m" ? `${i[key]} m (${Math.round(ft)} ft) → ${depthRange(ft)}` : `${i[key]} ft → ${depthRange(ft)}`; }
function dLabel(i,key){ const ft=depthFt(i,key); if(ft==null) return ""; return dUnit(i)==="m" ? `→ ${Math.round(ft)} ft · ${depthRange(ft)}` : `→ ${depthRange(ft)}`; }
function roundHour(t){ if(!t) return ""; let [h,m]=t.split(":").map(Number); if(m>=30) h=(h+1)%24; const ap=h<12?"AM":"PM"; const h12=h%12||12; return `${h12}:00 ${ap}`; }
function fmtDate(d){ if(!d) return ""; const [y,m,dd]=d.split("-"); return `${m}/${dd}/${y}`; }
function seenCount(sv){ return Object.keys(sv.counts).length + (sv.unlisted||[]).length; }
function missing(sv){
  const i=sv.info, m=[];
  if(!state.settings.memberNo) m.push("memberNo");
  if(!/^\d{8}$/.test(i.zone)) m.push("zone");
  if(!i.siteName) m.push("siteName");
  if(!i.date) m.push("date");
  if(!i.startTime) m.push("startTime");
  if(!i.bottomTime) m.push("bottomTime");
  if(!i.tempBottom && !i.tempSurface) m.push("temp");
  if(!i.vis) m.push("vis");
  if(!i.snorkel && i.avgDepth==="") m.push("avgDepth");
  if(i.maxDepth==="") m.push("maxDepth");
  if(!i.current) m.push("current");
  if(!i.habitat) m.push("habitat");
  if(seenCount(sv)===0) m.push("species");
  return m;
}

/* ---------- Reuse what you entered before ----------
   Site traits (habitat, depths, scuba/snorkel, units) carry over from your last dive at the same site.
   Conditions (visibility, current, temperatures) carry over only from a dive in the last few days. */
const SITE_FIELDS=["habitat","snorkel","tempUnit","depthUnit","avgDepth","maxDepth"];
const COND_FIELDS=["vis","current","tempBottom","tempSurface"];
const RECENT_DAYS=3;
const FIELD_NAMES={habitat:"habitat",snorkel:"scuba/snorkel",avgDepth:"average depth",maxDepth:"max depth",vis:"visibility",current:"current",tempBottom:"bottom temp",tempSurface:"surface temp"};
function daysApart(a,b){ return Math.abs((new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))/864e5); }
function lastSurveyAt(zone, exceptId){
  return Object.values(state.surveys).filter(x=>!x.example && x.id!==exceptId && zone && x.info.zone===zone)
    .sort((a,b)=>(b.info.date||"").localeCompare(a.info.date||"")||(b.info.startTime||"").localeCompare(a.info.startTime||"")||b.createdAt-a.createdAt)[0];
}
/* Fill only empty fields of `to` from `from`; returns the names of the fields it filled. */
function carryOver(to, from, {overwrite=false}={}){
  if(!from) return [];
  const recent = from.info.date && to.info.date && daysApart(from.info.date, to.info.date) <= RECENT_DAYS;
  const filled=[];
  for(const k of [...SITE_FIELDS, ...(recent?COND_FIELDS:[])]){
    let v=from.info[k]; if(v===""||v==null) continue;
    if(k==="tempUnit"||k==="depthUnit") continue; // keep this survey's units; values are converted below
    if((k==="avgDepth"||k==="maxDepth") && !isNaN(+v) && dUnit(from.info)!==dUnit(to.info))
      v=String(dUnit(to.info)==="m" ? Math.round(+v/FT_PER_M*10)/10 : Math.round(+v*FT_PER_M));
    if((k==="tempBottom"||k==="tempSurface") && !isNaN(+v) && (from.info.tempUnit||"F")!==(to.info.tempUnit||"F"))
      v=String((to.info.tempUnit||"F")==="C" ? Math.round((+v-32)*5/9*10)/10 : Math.round(+v*9/5+32));
    const empty = to.info[k]===""||to.info[k]==null||(k==="snorkel"&&to.info[k]===false);
    if(overwrite||empty){ if(to.info[k]!==v){ to.info[k]=v; if(FIELD_NAMES[k]) filled.push(k); } }
  }
  if(filled.length) to.prefill={from:from.info.date, fields:filled};
  return filled;
}
function nextDiveFrom(prev){
  const s=blank(); s.info.siteName=prev.info.siteName; s.info.zone=prev.info.zone;
  carryOver(s, prev); return s;
}

function renderSitePicker(main, sv){
  const q=(ui.siteQ||"").trim().toLowerCase().replace(/['’.]/g,""), area=ui.siteArea||"";
  const row=s=>`<button type="button" data-site="${s.code}"><span class="nm">${esc(s.name)}</span><span class="ar">${esc(s.area)}</span><span class="cd">${s.code}</span></button>`;
  let body="";
  if(q){
    const words=q.split(/\s+/);
    const hits=SITE_LIST.filter(s=>s.code.startsWith(q)||words.every(w=>s.hay.includes(w)));
    hits.sort((a,b)=>(b.name.toLowerCase().startsWith(q)-a.name.toLowerCase().startsWith(q))||a.name.localeCompare(b.name));
    body = hits.length? `<p class="hint">${hits.length} site${hits.length===1?"":"s"}${hits.length>80?" · showing the first 80, keep typing to narrow":""}</p><div class="sres">${hits.slice(0,80).map(row).join("")}</div>`
      : `<div class="empty">No California site matches “${esc(ui.siteQ)}”. Try another word, or browse by area below.</div>`;
  }
  if(!q){
    const recent=(state.settings.sites||[]).map(s=>SITE_BY_CODE[s.zone]||{code:s.zone,name:s.name,area:"Saved site"}).filter(s=>s.code).slice(-8).reverse();
    if(recent.length && !area) body+=`<h3>Your sites</h3><div class="sres">${recent.map(row).join("")}</div>`;
    // browse
    const kids=[...ZONES.keys()].filter(c=>c.length<8 && c.startsWith(area||"4") && c!==area && zoneParents(c).slice(-1)[0]===(area||"4"));
    const sitesHere=SITE_LIST.filter(s=>area && zoneParents(s.code).slice(-1)[0]===area);
    const count=c=>SITE_LIST.filter(s=>s.code.startsWith(c)).length;
    const trail=area?zoneParents(area).filter(p=>p.length>1).concat(area):[];
    body+=`<h3>Browse by area</h3>
      <div class="crumbs"><button type="button" data-area="">California</button>${trail.map(p=>` › <button type="button" data-area="${p}">${esc(tidy(ZONES.get(p)))}</button>`).join("")}</div>
      <div class="sres">${kids.filter(c=>count(c)).map(c=>`<button type="button" class="area" data-area="${c}"><span class="nm">${esc(tidy(ZONES.get(c)))}</span><span class="cd">${count(c)} ›</span></button>`).join("")}${sitesHere.map(row).join("")}</div>`;

function filtered(sv){
  if(ui.filter==="site" && !ui.q.trim()){ const f=siteFreq(sv.info.zone); if(f) return SPECIES.filter(s=>f.pct.has(s.code)||!!sv.counts[s.key]); }
  const q=ui.q.trim().toLowerCase();
  return SPECIES.filter(s=>{
    if(q) return s.name.toLowerCase().includes(q)||(s.sci||"").toLowerCase().includes(q)||s.fam.toLowerCase().includes(q)||s.code===q;
    switch(ui.filter){
      case "quick": return QUICKSET.has(s.name)||!!sv.counts[s.key];
      case "seen": return !!sv.counts[s.key];
      case "fish": return s.kind==="fish"||s.kind==="turtle";
      case "invert": return s.kind==="invert";
      case "algae": return s.kind==="algae";
      default: return true;
    }
  });
}
function spRow(s, sv, pct){
  const v=sv.counts[s.key];
  const btns = s.pa ? `<button type="button" data-sp="${s.key}" data-v="P" aria-pressed="${v==="P"}" aria-label="${esc(s.name)} present">Present</button>`
    : ["S","F","M","A"].map(a=>`<button type="button" data-sp="${s.key}" data-v="${a}" aria-pressed="${v===a}" aria-label="${esc(s.name)} ${ABUND[a]}">${a}</button>`).join("");
  return `<div class="sp ${v?"on":""}"><div><div class="nm">${esc(s.name)}</div><div class="sci">${pct!=null?`<span class="pct">${pct<1?"<1":pct}% of surveys here</span> · `:""}${esc(s.sci)}${s.code?` · <b>${s.code}</b>`:""}</div></div><div class="ab">${btns}</div></div>`;
}
function unlRow(u, sv){
  const cur=(sv.unlisted||[]).find(x=>x.sci===u.sci); const v=cur?.v;
  const btns=["S","F","M","A"].map(a=>`<button type="button" data-unl="${esc(u.sci)}" data-v="${a}" aria-pressed="${v===a}" aria-label="${esc(u.name)} ${ABUND[a]}">${a}</button>`).join("");
  const where=u.regs.length?u.regs.slice(0,3).map(r=>REGION_NAMES[r]||r).join(", ")+(u.regs.length>3?"…":""):"";
  return `<div class="sp ${v?"on":""}"><div><div class="nm">${esc(u.name)}</div><div class="sci">${esc(u.sci)}${where?` · <b>${esc(where)}</b>`:""}</div></div><div class="ab">${btns}</div></div>`;
}
function renderSpecies(main, sv, keepFocus){

  if(ui.filter==="site" && !freq) ui.filter="quick";

  const pctOf=s=>freq?.pct.get(s.code);
  let body="";

  else if(!list.length && !unlHits.length) body=`<div class="empty">No species match “${esc(ui.q)}”.</div>`;

    const groups={}; list.forEach(s=>(groups[s.fam]=groups[s.fam]||[]).push(s));
    body=Object.keys(groups).sort().map(f=>`<div class="fam">${esc(f)}</div>`+groups[f].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>spRow(s,sv)).join("")).join("");
  } else if(ui.filter==="site" && !ui.q.trim()) body=list.sort((a,b)=>(pctOf(b)??-1)-(pctOf(a)??-1)||a.name.localeCompare(b.name)).map(s=>spRow(s,sv,pctOf(s))).join("");
  else body=list.sort((a,b)=>a.name.localeCompare(b.name)).map(s=>spRow(s,sv,freq?pctOf(s):undefined)).join("");
  if(unlHits.length) body+=`<div class="fam">Other REEF species · enter as Unlisted on REEF</div>`+unlHits.map(u=>unlRow(u,sv)).join("");
  const siteName=freq?(freq.own?(sv.info.siteName||"this site"):tidy(ZONES.get(freq.code)||"this area")):"";

    ${ui.filter==="site"&&!ui.q.trim()&&freq?`<p class="hint">Sorted by how often REEF divers record each species at <b>${esc(siteName)}</b> (${freq.n.toLocaleString()} surveys)${freq.own?"":`. ${esc(sv.info.siteName||"This site")} has fewer than ${FREQ_MIN_SURVEYS} surveys, so this uses the wider area`}. Switch to “Common in CA” for the standard list.</p>`:""}
    ${!freq&&sv.info.zone&&FREQ.size?`<p class="hint">No REEF survey history for this site yet, so showing the standard list.</p>`:""}
    ${!sv.info.zone&&FREQ.size?`<p class="hint">Choose your dive site on the Dive tab to see the species usually found there.</p>`:""}
    <div class="legend"><span><b>S</b> 1</span><span><b>F</b> 2–10</span><span><b>M</b> 11–100</span><span><b>A</b> 101+</span><span>Tap again to clear</span></div>
  </div>
  <div class="splist" id="splist">${body}</div>

    <h3>Not on the California list?</h3>

    ${(sv.unlisted||[]).filter(u=>!u.sci).map(u=>`<div class="row"><span class="grow"><b>${esc(u.name)}</b> · ${ABUND[u.v]}</span><button class="btn danger" data-unl-del="${(sv.unlisted||[]).indexOf(u)}">Remove</button></div>`).join("")}

function summaryRows(sv){
  const seen=Object.entries(sv.counts).map(([k,v])=>({s:BYKEY[k],v})).filter(x=>x.s);
  const groups={}; seen.forEach(x=>{const g=x.s.kind==="fish"||x.s.kind==="turtle"?"Fish":x.s.kind==="algae"?"Algae":"Invertebrates"; (groups[g]=groups[g]||[]).push(x);});
  return ["Fish","Invertebrates","Algae"].filter(g=>groups[g]).map(g=>({g, rows:groups[g].sort((a,b)=>a.s.fam.localeCompare(b.s.fam)||a.s.name.localeCompare(b.s.name))}));
}
function summaryText(sv){
  const i=sv.info, L=[];
  L.push(`REEF SURVEY · Pacific Coast (PAC)`);
  L.push(`Member #: ${state.settings.memberNo||"—"}`);
  L.push(``,`STEP 1 · SURVEY INFO`);
  L.push(`Survey type: ${i.snorkel?"Snorkel":"Scuba"}`);
  L.push(`Date: ${fmtDate(i.date)}`);
  L.push(`Start time: ${roundHour(i.startTime)} (${i.startTime||"—"})`);
  L.push(`Zone code: ${i.zone||"—"}  Site: ${i.siteName||"—"}`);
  L.push(``,`STEP 2 · CONDITIONS`);
  L.push(`Water temp: bottom ${i.tempBottom||"—"} / surface ${i.tempSurface||"—"} °${i.tempUnit}`);
  L.push(`Bottom time: ${i.bottomTime||"—"} min`);
  L.push(`Visibility: ${i.vis||"—"}`);
  L.push(`Average depth: ${i.snorkel?"Snorkel":dShow(i,"avgDepth")||"—"}`);
  L.push(`Max depth: ${dShow(i,"maxDepth")||"—"}`);
  L.push(`Current: ${i.current||"—"}`);
  L.push(`Habitat: ${i.habitat||"—"}`);
  for(const {g,rows} of summaryRows(sv)){
    L.push(``,`${g.toUpperCase()} (${rows.length})`);
    let fam=""; for(const {s,v} of rows){ if(s.fam!==fam){fam=s.fam; L.push(`  ${fam}`);} L.push(`    ${v}  ${s.name}${s.code?" ["+s.code+"]":""}`); }
  }
  if(sv.unlisted?.length){ L.push(``,`UNLISTED (search in REEF's Unlisted Species)`); sv.unlisted.forEach(u=>L.push(`    ${u.v}  ${u.name}${u.sci?" ("+u.sci+")":""}`)); }
  return L.join("\n");
}

    surveyType:i.snorkel?"Snorkel":"Scuba",date:i.date,startTime:i.startTime,startHourRounded:roundHour(i.startTime),

/* ---------- Events ---------- */
function openSurvey(id, tab){ ui.filter=null; state.currentId=id; persist(); ui.tab=tab||"dive"; render(); $("#main").scrollTop=0; }
function rememberSite(sv){
  const {siteName,zone}=sv.info; if(!siteName||!/^\d{8}$/.test(zone)) return;
  const s=state.settings.sites=state.settings.sites||[];
  const ex=s.find(x=>x.name.toLowerCase()===siteName.toLowerCase());
  if(ex){ if(ex.zone===zone) return; ex.zone=zone; } else s.push({name:siteName,zone});
  state.settings.updatedAt=Date.now(); persist("__settings");
}
document.addEventListener("click", async e=>{
  const t=e.target.closest("button,[data-open]"); if(!t) return;
  const sv=cur();
  if(t.dataset.tab){ ui.tab=t.dataset.tab; if(ui.tab!=="log"&&!sv){ toast("Start or open a survey first"); ui.tab="log"; } render(); $("#main").scrollTop=0; return; }
  if(t.dataset.tabGo){ ui.tab=t.dataset.tabGo; render(); $("#main").scrollTop=0; return; }
  if(t.dataset.open){ openSurvey(t.dataset.open, state.surveys[t.dataset.open].status==="draft"?"dive":"review"); return; }
  if(t.dataset.seg){
    const k=t.dataset.seg, v=t.dataset.v, i=sv.info;
    if(k==="snorkel") i.snorkel = v==="Snorkel";
    else if(k==="tempUnit"){ i.tempUnit=v; state.settings.tempUnit=v; }
    else if(k==="depthUnit"){
      if(dUnit(i)!==v) for(const key of ["avgDepth","maxDepth"]){ const x=i[key]; if(x!==""&&x!=null&&!isNaN(+x)) i[key]=String(v==="m" ? Math.round(+x/FT_PER_M*10)/10 : Math.round(+x*FT_PER_M)); }
      i.depthUnit=v; state.settings.depthUnit=v;
    }
    else i[k] = i[k]===v ? "" : v;
    touch(sv); render(); return;
  }
  if(t.dataset.sp){
    const k=t.dataset.sp, v=t.dataset.v;
    if(sv.counts[k]===v) delete sv.counts[k]; else sv.counts[k]=v;
    touch(sv);
    const row=t.closest(".sp"); row.classList.toggle("on", !!sv.counts[k]);
    row.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===sv.counts[k]));
    $("#nSp").textContent=seenCount(sv)+" seen";
    const seenChip=document.querySelector('[data-filter="seen"]'); if(seenChip) seenChip.textContent=`Seen (${Object.keys(sv.counts).length})`;
    if(navigator.vibrate) try{navigator.vibrate(10)}catch(_){}
    return;
  }
  if(t.dataset.site){ const s=SITE_BY_CODE[t.dataset.site]||{code:t.dataset.site,name:(state.settings.sites||[]).find(x=>x.zone===t.dataset.site)?.name||""}; sv.info.zone=s.code; sv.info.siteName=s.name; delete sv.prefill; carryOver(sv, lastSurveyAt(s.code, sv.id)); rememberSite(sv); touch(sv); ui.filter=null; ui.tab="dive"; ui.siteQ=""; ui.siteArea=""; render(); $("#main").scrollTop=0; toast(s.name+" · "+s.code); return; }
  if("area" in t.dataset){ ui.siteArea=t.dataset.area; ui.siteQ=""; renderSitePicker($("#main"),sv); $("#main").scrollTop=0; return; }
  if(t.dataset.filter){ ui.filter=t.dataset.filter; ui.q=""; if(t.dataset.filter==="site"||t.dataset.filter==="quick"){ state.settings.spList=t.dataset.filter; persist(); } renderSpecies($("#main"),sv); return; }
  if("sort" in t.dataset){ ui.sort=ui.sort==="fam"?"az":"fam"; renderSpecies($("#main"),sv); return; }
  if(t.dataset.unl){
    const sci=t.dataset.unl, v=t.dataset.v, u=UNL_BY[sci]||{name:sci,sci,fam:""};
    sv.unlisted=sv.unlisted||[]; const ix=sv.unlisted.findIndex(x=>x.sci===sci);
    if(ix>=0 && sv.unlisted[ix].v===v) sv.unlisted.splice(ix,1);
    else if(ix>=0) sv.unlisted[ix].v=v;
    else sv.unlisted.push({name:u.name,sci:u.sci,fam:u.fam,v});
    touch(sv);
    const cur=sv.unlisted.find(x=>x.sci===sci);
    document.querySelectorAll(`[data-unl="${CSS.escape(sci)}"]`).forEach(b=>{ b.setAttribute("aria-pressed", b.dataset.v===cur?.v); b.closest(".sp").classList.toggle("on",!!cur); });
    $("#nSp").textContent=seenCount(sv)+" seen";
    const chip=document.querySelector('[data-filter="unlisted"]'); if(chip) chip.textContent=`Unlisted (${sv.unlisted.length})`;
    return;
  }
  if(t.dataset.unlDel){ sv.unlisted.splice(+t.dataset.unlDel,1); touch(sv); render(); return; }
  const act=t.dataset.act; if(!act) return;
  if(act==="edit-diver"){ ui.editDiver=true; render(); $("#memberNo")?.focus(); return; }
  if(act==="done-diver"){ ["memberNo","lastName"].forEach(id=>{const el=$("#"+id); if(el) saveDiverField(el);}); ui.editDiver=false; render(); toast("Saved"); return; }
  if(act==="now-time"){ const d=new Date(); sv.info.startTime=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); touch(sv); render(); return; }
  if(act==="new"){ const s=blank(); state.surveys[s.id]=s; openSurvey(s.id,"dive"); touch(s); return; }
  if(act==="repeat"){
    const last=Object.values(state.surveys).filter(x=>!x.example&&x.info.siteName).sort((a,b)=>b.createdAt-a.createdAt)[0]; if(!last) return;
    const s=nextDiveFrom(last); state.surveys[s.id]=s; openSurvey(s.id,"dive"); touch(s); toast("Next dive · "+last.info.siteName); return;
  }
  if(act==="pick-site"){ ui.tab="site"; ui.siteQ=""; ui.siteArea=sv.info.zone&&SITE_BY_CODE[sv.info.zone]?zoneParents(sv.info.zone).slice(-1)[0]:""; render(); $("#main").scrollTop=0; return; }
  if(act==="site-back"){ ui.tab="dive"; render(); return; }
  if(act==="unl-add"){ const n=$("#unlName").value.trim(); if(!n) return; (sv.unlisted=sv.unlisted||[]).push({name:n,v:$("#unlV").value}); touch(sv); render(); return; }
  if(act==="ready"){ sv.status="ready"; rememberSite(sv); touch(sv); render(); toast("Ready for REEF"); return; }
  if(act==="entered"){ sv.status="entered"; touch(sv); render(); toast("Marked as entered"); return; }
  if(act==="draft"){ sv.status="draft"; touch(sv); render(); return; }
  if(act==="copy-text"||act==="copy-json"){
    const txt=act==="copy-text"?summaryText(sv):autofillJSON(sv);
    try{ await navigator.clipboard.writeText(txt); toast("Copied"); }
    catch(_){ showText(act==="copy-text"?"Survey summary":"Survey data", txt); }
    return;
  }
  if(act==="dl-csv"){ saveFile(`reef-${sv.info.date}-${(sv.info.siteName||"site").replace(/[^a-z0-9]+/gi,"-")}.csv`, toCSV(sv), "text/csv"); return; }
  if(act==="backup"){ const d=new Date().toISOString().slice(0,10); saveFile(`reef-surveys-backup-${d}.json`, JSON.stringify({app:"REEF Dive Survey",exported:new Date().toISOString(),...state},null,1), "application/json"); state.settings.lastBackup=Date.now(); persist(); render(); return; }
  if(act==="restore"){ $("#restoreFile").click(); return; }
  if(act==="copy-ready"){ const ready=Object.values(state.surveys).filter(s=>s.status==="ready"); if(!ready.length){toast("No surveys are marked ready");return;} const txt="["+ready.map(s=>{const keep=state.currentId; state.currentId=s.id; const j=autofillJSON(s); state.currentId=keep; return j;}).join(",\n")+"]"; try{ await navigator.clipboard.writeText(txt); toast(`Copied ${ready.length} survey${ready.length>1?"s":""}`);}catch(_){ showText("Ready surveys",txt);} return; }
  if(act==="dup"){ const s=nextDiveFrom(sv); state.surveys[s.id]=s; openSurvey(s.id,"dive"); touch(s); toast("Next dive · "+(sv.info.siteName||"same site")); return; }
  if(act==="del"){ confirmBox(`Delete the survey at ${sv.info.siteName||"this site"}? This can't be undone.`, ()=>{ const id=sv.id; delete state.surveys[id]; state.deleted[id]=Date.now(); state.currentId=null; persist(id); ui.tab="log"; render(); toast("Deleted"); }); return; }
});
for(const ev of ["change","focusout"]) document.addEventListener(ev, e=>{ if(e.target.id==="memberNo"||e.target.id==="lastName") saveDiverField(e.target); });
document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.dataset?.open){ e.preventDefault(); e.target.click(); }});
document.addEventListener("input", e=>{
  const el=e.target, sv=cur();
  if(el.id==="siteQ"){ ui.siteQ=el.value; renderSitePicker($("#main"),sv); const q=$("#siteQ"); q.focus(); q.setSelectionRange(q.value.length,q.value.length); return; }
  if(el.id==="q"){ ui.q=el.value; renderSpecies($("#main"),sv,true); return; }
  if(el.id==="memberNo"||el.id==="lastName"){ saveDiverField(el); return; }
  if(!sv) return;
  const fields=["siteName","zone","date","startTime","bottomTime","tempBottom","tempSurface","avgDepth","maxDepth","notes"];
  if(fields.includes(el.id)){
    let v=el.value; if(el.id==="zone") v=v.replace(/\D/g,"").slice(0,8), el.value=v;
    sv.info[el.id]=v;
    if(el.id==="siteName"){ const hit=(state.settings.sites||[]).find(s=>s.name.toLowerCase()===v.toLowerCase()); if(hit&&!sv.info.zone){ sv.info.zone=hit.zone; $("#zone").value=hit.zone; } }
    touch(sv); refreshDiveLabels(sv);
    $("#hdrSub").textContent=(sv.info.siteName||"New survey")+" · "+fmtDate(sv.info.date);
  }
});
function refreshDiveLabels(sv){
  if(ui.tab!=="dive") return;
  const i=sv.info, m=new Set(missing(sv));
  document.querySelectorAll("label[data-k]").forEach(l=>l.classList.toggle("missing", m.has(l.dataset.k)));
  const set=(id,t)=>{const el=document.getElementById(id); if(el) el.textContent=t;};
  set("lbl-startTime","Start time "+(i.startTime?"→ "+roundHour(i.startTime):""));
  set("lbl-avgDepth",`Average depth (${dUnit(i)}) `+(i.snorkel?"→ Snorkel":dLabel(i,"avgDepth")));
  set("lbl-maxDepth",`Max depth (${dUnit(i)}) `+dLabel(i,"maxDepth"));
}

function toCSV(sv){
  const i=sv.info, q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const head=["member_no","date","start_time","zone_code","site","survey_type","bottom_time_min","temp_bottom","temp_surface","temp_unit","visibility","avg_depth","max_depth","current","habitat","species_code","common_name","scientific_name","abundance"];
  const base=[state.settings.memberNo,i.date,i.startTime,i.zone,i.siteName,i.snorkel?"Snorkel":"Scuba",i.bottomTime,i.tempBottom,i.tempSurface,i.tempUnit,i.vis,i.snorkel?"Snorkel":dRange(i,"avgDepth"),dRange(i,"maxDepth"),i.current,i.habitat];
  const rows=Object.entries(sv.counts).map(([k,v])=>[...base,BYKEY[k]?.code,BYKEY[k]?.name,BYKEY[k]?.sci,v]).concat((sv.unlisted||[]).map(u=>[...base,"unlisted",u.name,u.sci||"",u.v]));
  return [head,...rows].map(r=>r.map(q).join(",")).join("\n");
}
function showText(title, txt){
  const f=$("#dlgForm"); f.innerHTML=`<h2>${esc(title)}</h2><p class="hint">Copying was blocked here. Select the text below and copy it.</p><pre class="out">${esc(txt)}</pre><div class="row" style="margin-top:12px"><button class="btn grow" value="ok">Done</button></div>`;
  $("#dlg").showModal();
}
function confirmBox(msg, onYes){
  const f=$("#dlgForm"); f.innerHTML=`<p>${esc(msg)}</p><div class="row"><button class="btn danger grow" value="yes" id="yesBtn">Delete</button><button class="btn ghost" value="no">Cancel</button></div>`;
  const d=$("#dlg"); d.onclose=()=>{ if(d.returnValue==="yes") onYes(); d.onclose=null; }; d.showModal();
}

function saveFile(name, text, type){
  const blob=new Blob([text],{type});
  const file=new File([blob],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){ navigator.share({files:[file],title:name}).catch(()=>{}); return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
document.addEventListener("change", async e=>{
  if(e.target.id!=="restoreFile") return;
  const f=e.target.files[0]; if(!f) return;
  try{
    const data=JSON.parse(await f.text());
    if(!data.surveys) throw new Error("not a backup");
    let added=0;
    for(const sv of Object.values(data.surveys)){ const l=state.surveys[sv.id]; if(!l||(sv.updatedAt||0)>(l.updatedAt||0)){ state.surveys[sv.id]=sv; added++; } }
    if(data.settings){ const sites=state.settings.sites||[]; for(const s of data.settings.sites||[]) if(!sites.find(x=>x.name.toLowerCase()===s.name.toLowerCase())) sites.push(s); state.settings.sites=sites; if(!state.settings.memberNo) state.settings.memberNo=data.settings.memberNo||""; if(!state.settings.lastName) state.settings.lastName=data.settings.lastName||""; }
    persist(); render(); toast(`Restored ${added} survey${added===1?"":"s"}`);
  }catch(_){ toast("That file isn't a REEF Dive Survey backup"); }
  e.target.value="";
});

/* ---------- Boot ---------- */
let downloads=null;
render();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").then(()=>setSync("Offline ready",true)).catch(()=>setSync("Online only",false)); }
if(navigator.storage&&navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
</script>
